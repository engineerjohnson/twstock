name: 更新台股分析資料並發布網站

on:
  schedule:
    # GitHub 用 UTC；台北 = UTC+8。GitHub 排程常延遲 10~60 分鐘、整點更常被略過，
    # 所以改成「每 30 分鐘、避開整點」(台北 06:07 ~ 23:37)，就算被略過一次，下一次也會補上。
    # 模式由 app.cloud_sync auto 自動判斷：收盤後 (16:30) 若行情/法人還沒抓到就跑完整更新，否則只更新新聞+國際行情。
    - cron: "7,37 22,23,0-15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "news (新聞+國際行情) / full (行情/法人/籌碼完整更新) / auto"
        default: "auto"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 還原資料庫快取 (避免每次重抓 3 個月)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/twstock.db
          key: twstock-db-${{ github.run_id }}
          restore-keys: |
            twstock-db-

      - name: 同步資料並產生靜態網站
        run: python -m app.cloud_sync ${{ github.event.inputs.mode || 'auto' }}

      - name: 儲存資料庫快取
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/twstock.db
          key: twstock-db-${{ github.run_id }}

      - name: 發布到 GitHub Pages (gh-pages 分支，不保留歷史以節省空間)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "update ${{ github.run_id }}"
